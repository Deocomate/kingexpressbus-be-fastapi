# Backend — Coolify / Docker Desktop production stack
# mysql → migrate → api + mail_worker
# DB_HOST is fixed to compose service `mysql`.
# ${VAR} below appear in Coolify Environment Variables UI — edit there / in `.env`.

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_kingexpressbus}
      MYSQL_USER: ${DB_USERNAME:-keb}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-db_kingexpressbus}
      DB_USERNAME: ${DB_USERNAME:-keb}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "on-failure"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-db_kingexpressbus}
      DB_USERNAME: ${DB_USERNAME:-keb}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      UPLOAD_ROOT: /data/uploads

      JWT_SECRET: ${JWT_SECRET}
      SUCCESS_URL_SIGNING_KEY: ${SUCCESS_URL_SIGNING_KEY}

      CORS_ORIGINS: ${CORS_ORIGINS:-https://kingexpressbus.com,https://www.kingexpressbus.com,https://kingexpressbus-fe-nextjs.vercel.app}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://kingexpressbus.com}
      SUCCESS_PATH_TEMPLATE: ${SUCCESS_PATH_TEMPLATE:-/dat-ve/thanh-cong/{booking}}

      SEPAY_ENVIRONMENT: ${SEPAY_ENVIRONMENT:-production}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY}
      SEPAY_CHECKOUT_URL: ${SEPAY_CHECKOUT_URL:-https://pay.sepay.vn/v1/checkout/init}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-King Express Bus}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-3}
      MAIL_QUEUE_INLINE: ${MAIL_QUEUE_INLINE:-false}
    expose:
      - "8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mail_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.mail_worker"]
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-db_kingexpressbus}
      DB_USERNAME: ${DB_USERNAME:-keb}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET}
      SUCCESS_URL_SIGNING_KEY: ${SUCCESS_URL_SIGNING_KEY}

      CORS_ORIGINS: ${CORS_ORIGINS:-https://kingexpressbus.com,https://www.kingexpressbus.com,https://kingexpressbus-fe-nextjs.vercel.app}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://kingexpressbus.com}
      SUCCESS_PATH_TEMPLATE: ${SUCCESS_PATH_TEMPLATE:-/dat-ve/thanh-cong/{booking}}

      SEPAY_ENVIRONMENT: ${SEPAY_ENVIRONMENT:-production}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY}
      SEPAY_CHECKOUT_URL: ${SEPAY_CHECKOUT_URL:-https://pay.sepay.vn/v1/checkout/init}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-King Express Bus}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-3}
      MAIL_QUEUE_INLINE: ${MAIL_QUEUE_INLINE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  uploads_data:
  mysql_data:
