# Backend — Coolify / Docker Desktop production stack
# mysql healthy → api (migrate + serve) → mail_worker (waits for api healthy)
#
# DB_PASSWORD is baked into mysql_data on FIRST start only.
# If you change DB_PASSWORD in Coolify after that → Access denied (1045).
# Fix: Storages → delete `mysql_data` → redeploy (wipes DB data).
#
# ${VAR} appear in Coolify Environment Variables UI.

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_kingexpressbus}
      MYSQL_USER: ${DB_USERNAME:-keb}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-db_kingexpressbus}
      DB_USERNAME: ${DB_USERNAME:-keb}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      UPLOAD_ROOT: /data/uploads
      RUN_MIGRATIONS: "1"

      JWT_SECRET: ${JWT_SECRET}
      SUCCESS_URL_SIGNING_KEY: ${SUCCESS_URL_SIGNING_KEY}

      # Cookie session for browser login (FE ↔ API).
      # Same site (kingexpressbus.com + api.kingexpressbus.com): lax + secure.
      # Different sites (Vercel *.vercel.app + Coolify API): none + secure.
      COOKIE_NAME: ${COOKIE_NAME:-keb_session}
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}

      # Exact FE origins when using credentialed cookies (prefer over *).
      CORS_ORIGINS: "${CORS_ORIGINS:-https://kingexpressbus.com,https://www.kingexpressbus.com}"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://kingexpressbus.com}
      SUCCESS_PATH_TEMPLATE: ${SUCCESS_PATH_TEMPLATE:-/dat-ve/thanh-cong/{booking}}

      SEPAY_ENVIRONMENT: ${SEPAY_ENVIRONMENT:-production}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY}
      SEPAY_CHECKOUT_URL: ${SEPAY_CHECKOUT_URL:-https://pay.sepay.vn/v1/checkout/init}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-King Express Bus}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-3}
      MAIL_QUEUE_INLINE: ${MAIL_QUEUE_INLINE:-false}
    expose:
      - "8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mail_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.mail_worker"]
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-db_kingexpressbus}
      DB_USERNAME: ${DB_USERNAME:-keb}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

      JWT_SECRET: ${JWT_SECRET}
      SUCCESS_URL_SIGNING_KEY: ${SUCCESS_URL_SIGNING_KEY}

      CORS_ORIGINS: "${CORS_ORIGINS:-https://kingexpressbus.com,https://www.kingexpressbus.com}"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://kingexpressbus.com}
      SUCCESS_PATH_TEMPLATE: ${SUCCESS_PATH_TEMPLATE:-/dat-ve/thanh-cong/{booking}}

      SEPAY_ENVIRONMENT: ${SEPAY_ENVIRONMENT:-production}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY}
      SEPAY_CHECKOUT_URL: ${SEPAY_CHECKOUT_URL:-https://pay.sepay.vn/v1/checkout/init}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-King Express Bus}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-3}
      MAIL_QUEUE_INLINE: ${MAIL_QUEUE_INLINE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      api:
        # Wait until api finished alembic + /health (mail_jobs exists).
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
  mysql_data:
